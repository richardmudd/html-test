<script>

/*

const PROXY =
  "https://empty-flower-34e6.nathanmedina2009423.workers.dev/?url=";


/*
 * ------------------------------------------------

 * ------------------------------------------------
 *
 * Put your e621 username here.
 *

 *
 * Do NOT put your e621 account password here.
 * e621 API authentication uses the API key.
 */

const E621_USERNAME =
  "richardmudd";

const E621_API_KEY =
  "qKgbchYXZzC17QDWEtj1f511";


/*
 * ================================================================
 * DOM
 * ================================================================
 */

const logEl =
  document.getElementById("log");

const progressEl =
  document.getElementById("progressBar");


/*
 * ================================================================
 * LOGGING
 * ================================================================
 */

function log(message) {
  logEl.textContent += message + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}


/*
 * ================================================================
 * URL HELPERS
 * ================================================================
 */

function resolveUrl(base, relative) {
  try {
    return new URL(relative, base).href;
  } catch (error) {
    return null;
  }
}


function filenameFromUrl(url, index) {

  try {

    const u =
      new URL(url);

    let name =
      u.pathname.split("/").pop();

    if (!name) {
      name = `image_${index}`;
    }

    if (!/\.[a-zA-Z0-9]{2,5}$/.test(name)) {
      name += ".jpg";
    }

    return (
      String(index).padStart(3, "0") +
      "_" +
      name
    );

  } catch (error) {

    return `image_${index}.jpg`;
  }
}


function getRule34Id(pageUrl) {

  try {

    const u =
      new URL(pageUrl);

    return u.searchParams.get("id");

  } catch (error) {

    return null;
  }
}


function getE621Id(pageUrl) {

  try {

    const u =
      new URL(pageUrl);

    const match =
      u.pathname.match(/\/posts\/(\d+)/i);

    return match
      ? match[1]
      : null;

  } catch (error) {

    return null;
  }
}


function isRule34Url(url) {

  try {

    const host =
      new URL(url).hostname
        .toLowerCase();

    return (
      host === "rule34.xxx" ||
      host.endsWith(".rule34.xxx")
    );

  } catch (error) {

    return false;
  }
}


function isE621Url(url) {

  try {

    const host =
      new URL(url).hostname
        .toLowerCase();

    return (
      host === "e621.net" ||
      host.endsWith(".e621.net")
    );

  } catch (error) {

    return false;
  }
}


/*
 * ================================================================
 * PROXY FETCH
 * ================================================================
 *
 * Everything that needs to go through your Worker goes here.
 */

async function fetchThroughWorker(targetUrl) {

  const workerUrl =
    PROXY +
    encodeURIComponent(targetUrl);

  const response =
    await fetch(workerUrl);

  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );
  }

  return response;
}


/*
 * ================================================================
 * e621 API
 * ================================================================
 */

async function fetchE621Post(postId) {

  if (
    !E621_USERNAME ||
    E621_USERNAME === "YOUR_E621_USERNAME" ||
    !E621_API_KEY ||
    E621_API_KEY === "YOUR_E621_API_KEY"
  ) {

    throw new Error(
      "e621 credentials have not been configured in the HTML"
    );
  }


  const apiUrl =
    "https://e621.net/posts.json" +
    "?tags=id:" +
    encodeURIComponent(postId) +
    "&limit=1";


  const authorization =
    "Basic " +
    btoa(
      E621_USERNAME +
      ":" +
      E621_API_KEY
    );


  const response =
    await fetch(apiUrl, {
      method: "GET",

      headers: {
        "Authorization":
          authorization,

        /*
         * e621 requires an identifiable
         * application User-Agent.
         */
        "X-Application":
          "PersonalImageDownloader/1.0"
      }
    });


  if (!response.ok) {

    throw new Error(
      `e621 API HTTP ${response.status}`
    );
  }


  const data =
    await response.json();


  if (
    !data.posts ||
    !data.posts.length
  ) {

    throw new Error(
      `e621 returned no post for ID ${postId}`
    );
  }


  return data.posts[0];
}


/*
 * ================================================================
 * e621 POST EXTRACTION
 * ================================================================
 */

async function extractE621(pageUrl) {

  const postId =
    getE621Id(pageUrl);


  if (!postId) {

    throw new Error(
      "Could not determine e621 post ID"
    );
  }


  const post =
    await fetchE621Post(postId);


  if (
    !post.file ||
    !post.file.url
  ) {

    throw new Error(
      `e621 post ${postId} has no original image URL`
    );
  }


  const tags = [];


  if (post.tags) {

    const groups = [
      "general",
      "artist",
      "character",
      "copyright",
      "species",
      "meta",
      "lore"
    ];


    for (const group of groups) {

      if (
        Array.isArray(
          post.tags[group]
        )
      ) {

        for (
          const tag of post.tags[group]
        ) {

          if (
            tag &&
            !tags.includes(tag)
          ) {

            tags.push(tag);
          }
        }
      }
    }
  }


  let artist = "";

  if (
    post.tags &&
    Array.isArray(post.tags.artist)
  ) {

    artist =
      post.tags.artist.join(", ");
  }


  /*
   * e621 doesn't provide a conventional
   * post title, so use a useful filename.
   */

  const title =
    `e621 Post ${post.id}`;


  return {

    id:
      String(post.id),

    title,

    artist,

    tags,

    urls: [
      post.file.url
    ]

  };
}


/*
 * ================================================================
 * Rule34 API
 * ================================================================
 */

async function extractRule34(pageUrl) {

  const postId =
    getRule34Id(pageUrl);


  if (!postId) {

    throw new Error(
      "Could not determine Rule34 post ID"
    );
  }


  /*
   * Rule34's API endpoint.
   *
   * Authentication parameters are intentionally
   * not embedded here because your Worker/API
   * configuration handles the authenticated request.
   */

  const apiUrl =
    "https://api.rule34.xxx/index.php" +
    "?page=dapi" +
    "&s=post" +
    "&q=index" +
    "&id=" +
    encodeURIComponent(postId);


  const response =
    await fetchThroughWorker(apiUrl);


  const text =
    await response.text();


  /*
   * Parse XML.
   */

  const parser =
    new DOMParser();

  const xml =
    parser.parseFromString(
      text,
      "application/xml"
    );


  const post =
    xml.querySelector("post");


  if (!post) {

    throw new Error(
      `Rule34 API returned no post for ID ${postId}`
    );
  }


  const fileUrl =
    post.getAttribute("file_url");


  if (!fileUrl) {

    throw new Error(
      `Rule34 post ${postId} has no original image URL`
    );
  }


  const tagsText =
    post.getAttribute("tags") || "";


  const tags =
    tagsText
      .split(/\s+/)
      .map(x => x.trim())
      .filter(Boolean);


  return {

    id:
      String(postId),

    title:
      `Rule34 Post ${postId}`,

    artist:
      "",

    tags,

    urls: [
      fileUrl
    ]

  };
}


/*
 * ================================================================
 * GENERIC / HDPORNCOMICS PAGE EXTRACTION
 * ================================================================
 */

async function extractGenericPage(pageUrl) {

  const response =
    await fetchThroughWorker(pageUrl);


  const html =
    await response.text();


  const doc =
    new DOMParser()
      .parseFromString(
        html,
        "text/html"
      );


  /*
   * Title
   */

  const titleEl =
    doc.querySelector("h1");


  const title =
    titleEl
      ? titleEl.textContent.trim()
      : slugFromUrl(pageUrl);


  /*
   * Artist
   */

  let artist = "";


  const infoRows =
    Array.from(
      doc.querySelectorAll(
        "#infoBox .flex.items-center"
      )
    );


  for (
    const row of infoRows
  ) {

    const label =
      row.querySelector(
        "span.text-gray-400"
      );


    if (
      label &&
      /artist/i.test(
        label.textContent
      )
    ) {

      const link =
        row.querySelector(
          ".scrollTaxonomy a"
        );


      if (link) {
        artist =
          link.textContent.trim();
      }


      break;
    }
  }


  /*
   * Tags
   */

  let tags = [];


  for (
    const row of infoRows
  ) {

    const label =
      row.querySelector(
        "span.text-gray-400"
      );


    if (
      label &&
      /tags?/i.test(
        label.textContent
      )
    ) {

      const links =
        Array.from(
          row.querySelectorAll(
            ".scrollTaxonomy a"
          )
        );


      tags =
        links
          .map(
            a =>
              a.textContent.trim()
          )
          .filter(Boolean);


      break;
    }
  }


  /*
   * Fallback tag container
   */

  if (!tags.length) {

    const tagBlock =
      doc.querySelector(
        ".tags, .post-tags, [class*='tag-list']"
      );


    if (tagBlock) {

      tags =
        Array.from(
          tagBlock.querySelectorAll("a")
        )
        .map(
          a =>
            a.textContent.trim()
        )
        .filter(Boolean);
    }
  }


  /*
   * HDPornComics gallery
   */

  const galleryLinks =
    Array.from(
      doc.querySelectorAll(
        '.my-gallery a[itemprop="contentUrl"], figure[itemtype="https://schema.org/ImageObject"] a'
      )
    );


  let urls;


  if (
    galleryLinks.length > 0
  ) {

    urls =
      galleryLinks
        .map(
          a =>
            a.getAttribute("href")
        )
        .filter(Boolean)
        .map(
          href =>
            resolveUrl(
              pageUrl,
              href
            )
        );

  } else {

    /*
     * Generic image containers
     */

    const selectors = [
      ".reading-content",
      ".entry-content",
      ".comic-images",
      "#chapter-images",
      "article"
    ];


    let scope = null;


    for (
      const selector of selectors
    ) {

      const element =
        doc.querySelector(
          selector
        );


      if (
        element &&
        element.querySelectorAll(
          "img"
        ).length > 0
      ) {

        scope = element;
        break;
      }
    }


    const imgs =
      Array.from(
        (
          scope ||
          doc
        ).querySelectorAll(
          "img"
        )
      );


    urls =
      imgs
        .map(
          img =>
            img.getAttribute(
              "data-src"
            ) ||
            img.getAttribute(
              "data-lazy-src"
            ) ||
            img.getAttribute(
              "src"
            )
        )
        .filter(Boolean)
        .map(
          src =>
            resolveUrl(
              pageUrl,
              src
            )
        );
  }


  urls =
    urls
      .filter(Boolean)
      .filter(
        u =>
          !/gravatar\.com|avatar|logo|icon/i
            .test(u)
      );


  return {

    id:
      slugFromUrl(pageUrl),

    title,

    artist,

    tags,

    urls:
      [
        ...new Set(urls)
      ]

  };
}


/*
 * ================================================================
 * PAGE ROUTER
 * ================================================================
 */

async function extractPage(pageUrl) {

  if (
    isE621Url(pageUrl)
  ) {

    return extractE621(
      pageUrl
    );
  }


  if (
    isRule34Url(pageUrl)
  ) {

    return extractRule34(
      pageUrl
    );
  }


  return extractGenericPage(
    pageUrl
  );
}


/*
 * ================================================================
 * SLUG
 * ================================================================
 */

function slugFromUrl(pageUrl) {

  try {

    const u =
      new URL(pageUrl);


    /*
     * Rule34
     */

    if (
      isRule34Url(pageUrl)
    ) {

      const id =
        u.searchParams.get("id");

      if (id) {
        return id;
      }
    }


    /*
     * e621
     */

    if (
      isE621Url(pageUrl)
    ) {

      const id =
        getE621Id(pageUrl);

      if (id) {
        return id;
      }
    }


    /*
     * Generic page
     */

    const parts =
      u.pathname
        .split("/")
        .filter(Boolean);


    return (
      parts[parts.length - 1] ||
      u.hostname
    )
      .slice(0, 80);


  } catch (error) {

    return "page";
  }
}


/*
 * ================================================================
 * CONCURRENCY POOL
 * ================================================================
 */

async function runPool(
  items,
  limit,
  worker
) {

  const results =
    new Array(items.length);


  let next = 0;


  async function runner() {

    while (
      next < items.length
    ) {

      const index =
        next++;


      results[index] =
        await worker(
          items[index],
          index
        );
    }
  }


  const runners =
    Array.from(
      {
        length:
          Math.min(
            limit,
            items.length
          )
      },
      runner
    );


  await Promise.all(
    runners
  );


  return results;
}


/*
 * ================================================================
 * DOWNLOAD
 * ================================================================
 */

document
  .getElementById("goBtn")
  .addEventListener(
    "click",
    async () => {

      const raw =
        document
          .getElementById(
            "pageUrls"
          )
          .value
          .trim();


      if (!raw) {

        alert(
          "Enter at least one URL."
        );

        return;
      }


      const pageUrls =
        [
          ...new Set(
            raw
              .split("\n")
              .map(
                s =>
                  s.trim()
              )
              .filter(Boolean)
          )
        ];


      logEl.textContent = "";

      progressEl.style.display =
        "block";

      progressEl.value = 0;


      const zip =
        new JSZip();


      let totalImages = 0;

      let totalFailed = 0;

      let pagesDone = 0;


      const allTags = [];


      const PAGE_CONCURRENCY = 4;

      const IMAGE_CONCURRENCY = 6;


      await runPool(
        pageUrls,
        PAGE_CONCURRENCY,
        async pageUrl => {

          let data;


          try {

            data =
              await extractPage(
                pageUrl
              );

          } catch (error) {

            log(
              `FAILED PAGE  ${pageUrl} — ${error.message}`
            );


            pagesDone++;

            progressEl.value =
              pagesDone /
              pageUrls.length;


            return;
          }


          const folder =
            String(
              data.id ||
              slugFromUrl(
                pageUrl
              )
            );


          const title =
            data.title ||
            `Post ${folder}`;


          const artist =
            data.artist ||
            "";


          const tags =
            data.tags ||
            [];


          const urls =
            data.urls ||
            [];


          if (!urls.length) {

            log(
              `  No images found for "${title}".`
            );


            pagesDone++;

            progressEl.value =
              pagesDone /
              pageUrls.length;


            return;
          }


          /*
           * Metadata
           */

          zip.file(
            `${folder}/title.txt`,
            title
          );


          if (artist) {

            zip.file(
              `${folder}/artist.txt`,
              artist
            );
          }


          if (tags.length) {

            zip.file(
              `${folder}/tags.txt`,
              tags.join("\n")
            );


            allTags.push({
              title,
              tags
            });
          }


          let failedHere = 0;


          await runPool(
            urls,
            IMAGE_CONCURRENCY,
            async (
              imageUrl,
              index
            ) => {

              try {

                /*
                 * ALWAYS send the actual image
                 * through the Worker.
                 *
                 * This is especially important
                 * for e621 static1.e621.net.
                 */

                const response =
                  await fetchThroughWorker(
                    imageUrl
                  );


                if (
                  !response.ok
                ) {

                  throw new Error(
                    `HTTP ${response.status}`
                  );
                }


                const blob =
                  await response.blob();


                const filename =
                  filenameFromUrl(
                    imageUrl,
                    index + 1
                  );


                zip.file(
                  `${folder}/${filename}`,
                  blob
                );


                totalImages++;


              } catch (error) {

                failedHere++;

                totalFailed++;


                log(
                  `FAILED IMAGE ${imageUrl} — ${error.message}`
                );
              }
            }
          );


          log(
            `${data.id ? `"${title}"` : `"${title}"`}` +
            `${artist ? " by " + artist : ""}` +
            `${tags.length ? " — " + tags.length + " tag(s)" : ""}` +
            ` — ${urls.length - failedHere}/${urls.length} image(s)` +
            `${failedHere ? " (" + failedHere + " failed)" : ""}` +
            ` — folder: ${folder}`
          );


          pagesDone++;


          progressEl.value =
            pagesDone /
            pageUrls.length;
        }
      );


      log(
        `\nZipping ${totalImages} image(s) from ${pageUrls.length} page(s)` +
        `${totalFailed ? " (" + totalFailed + " failed)" : ""}...`
      );


      const content =
        await zip.generateAsync({
          type: "blob"
        });


      const a =
        document.createElement(
          "a"
        );


      a.href =
        URL.createObjectURL(
          content
        );


      a.download =
        "comics.zip";


      a.click();


      log(
        "Done. Download should start automatically."
      );


      /*
       * Copy Tags
       */

      const copyBtn =
        document.getElementById(
          "copyTagsBtn"
        );


      if (
        allTags.length > 0
      ) {

        copyBtn.style.display =
          "inline-block";


        copyBtn.onclick =
          () => {

            const text =
              allTags.length === 1

                ? allTags[0].tags.join(
                    ", "
                  )

                : allTags
                    .map(
                      c =>
                        `${c.title}:\n${c.tags.join(", ")}`
                    )
                    .join(
                      "\n\n"
                    );


            navigator
              .clipboard
              .writeText(text)

              .then(
                () => {

                  copyBtn.textContent =
                    "Copied!";


                  setTimeout(
                    () => {

                      copyBtn.textContent =
                        "Copy Tags";

                    },
                    1500
                  );
                }
              )

              .catch(
                () => {

                  alert(
                    "Copy failed — clipboard permission denied."
                  );
                }
              );
          };

      } else {

        copyBtn.style.display =
          "none";
      }

    }
  );


/*
 * ================================================================
 * PRESET URL SUPPORT
 * ================================================================
 */

const params =
  new URLSearchParams(
    location.search
  );


const presetUrl =
  params.get("url") ||
  params.get("text");


if (presetUrl) {

  document
    .getElementById(
      "pageUrls"
    )
    .value =
      presetUrl;


  document
    .getElementById(
      "goBtn"
    )
    .click();
}

</script>

</body>
</html>
